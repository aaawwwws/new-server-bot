services:
  bot:
    build: .
    env_file: .env
    environment:
      # コンテナ内からは「db」という名前でDBにつなぐ（.env の DATABASE_URL は PC 上での開発用）
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 管理レポートで、DBのバックアップが作られているかを見るため（見るだけ）
      - ./backups:/backups:ro
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # データはここに残るので、docker compose down しても消えない（down -v で消える）
      - db-data:/var/lib/postgresql/data
    ports:
      # PC 上の npm run dev からつなぐため。127.0.0.1 なので外部からは見えない
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # DBのバックアップ。毎日4時（日本時間）すぎに ./backups へ保存し、14日より古いものは消す（中身は scripts/backup.sh）
  backup:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      options:
        max-size: 1m
        max-file: "3"

volumes:
  db-data:
